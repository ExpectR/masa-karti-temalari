 if(onlineLoaded&&!force){sDraw();return Promise.resolve()}
 onlineBusy=true;onlineMsg('Online temalar kontrol ediliyor…');
 var bust=force?'?refresh='+Date.now():'';
 onlineRequest=fetch(ONLINE_CATALOG+bust,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('Katalog alınamadı ('+r.status+')');return r.json()}).then(function(cat){
  if(!cat||cat.schemaVersion!==1||!Array.isArray(cat.themes))throw new Error('Katalog biçimi geçersiz');
  var cached=ldK('mk3_online_cache');
  return Promise.all(cat.themes.slice(0,100).filter(safeThemeMeta).map(function(meta){
   return fetch(ONLINE_THEME_BASE+meta.file+bust,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('Tema indirilemedi');return r.json()}).then(function(t){return parseOnlineTheme(meta,t)?{meta:meta,theme:t}:null}).catch(function(){return cached.filter(function(p){return p&&p.meta&&p.meta.id===meta.id&&parseOnlineTheme(p.meta,p.theme)})[0]||null});
  }));
 }).then(function(pairs){
  pairs=pairs.filter(Boolean);var keep={};pairs.forEach(function(p){var key='online_'+p.meta.id;TH[key]=parseOnlineTheme(p.meta,p.theme);keep[key]=true});
  Object.keys(TH).forEach(function(k){if(TH[k].remote&&!keep[k])delete TH[k]});svK('mk3_online_cache',pairs);
  if(!TH[S.theme]||themeHidden(S.theme)){var opts=thOpts(S.cat);if(!opts.length){S.cat='own';opts=thOpts('own')}S.theme=opts[0][0];S.hideBase=S.cat=='own';applyTheme(S.theme)}
  onlineLoaded=true;fillTheme();sync();render();sDraw();onlineMsg(pairs.filter(function(p){return !themeHidden('online_'+p.meta.id)}).length+' online tema yüklendi. Son kontrol: '+new Date().toLocaleTimeString('tr-TR'));
 }).catch(function(e){onlineMsg('Online mağaza hatası: '+(e&&e.message?e.message:'Bağlantı kurulamadı')+'. Kayıtlı temalar kullanılabilir.')}).finally(function(){onlineBusy=false;onlineRequest=null});
 return onlineRequest;
}

if(themeHidden(S.theme)){var initialOptions=thOpts(S.cat);if(!initialOptions.length){S.cat='own';initialOptions=thOpts('own')}S.theme=initialOptions[0][0];S.hideBase=S.cat=='own'}
ui();edInit();storeInit();
var oldStoreOpen=$('sopen').onclick;
$('sopen').onclick=function(){if(oldStoreOpen)oldStoreOpen();loadOnlineThemes(false)};

var storeHead=$('store').querySelector('.shead');if(storeHead&&!$('onlineRefresh')){var rb=document.createElement('button');rb.id='onlineRefresh';rb.textContent='↻ Online yenile';rb.style.marginLeft='auto';rb.onclick=function(){loadOnlineThemes(true)};storeHead.insertBefore(rb,$('sx'))}
var naturalFirstRun=false;try{naturalFirstRun=!localStorage.getItem('mk3_natural_v1')}catch(e){}
if(naturalFirstRun){S.theme='natural_rose';S.cat='bayan';S.bgImg='';fillTheme();applyTheme(S.theme);try{localStorage.setItem('mk3_natural_v1','1')}catch(e){}}
tpBuild();sync();render();edP();
loadOnlineThemes(false);
if(window.UmutShell)window.UmutShell.ready(APP_VERSION);else{document.getElementById('appVersion').textContent='v'+APP_VERSION;document.getElementById('appUpdate').onclick=function(){document.getElementById('appUpdateStatus').textContent='Update için depodaki ana umutcan.html başlangıç dosyasını aç.'}}
</script>
